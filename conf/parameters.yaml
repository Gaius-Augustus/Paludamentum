#   utr: true                    # UTRs from the StringTie assemblies (modes with transcripts)
#   max_utr_extension: 5000
# qc:
#   busco_lineage: eukaryota_odb12      # compleasm and BUSCO; null = no completeness assessment
#   busco_download_path: null    # lineage cache; null = ~/.cache/paludamentum/busco
#   compleasm: true
#   busco: true
#   omark: false                 # needs omamer_db
#   omamer_db: /abs/path/LUCA.h5
#   ete_taxa_path: null          # NCBI taxonomy cache for OMArk; null = ~/.cache/paludamentum/ncbi_taxonomy
#   reference_annotation: /abs/path/reference.gff3   # gffcompare at CDS level
#   gene_support: true
#   statistics: true
#   report: true
# ncrna:
#   run: false                   # rRNA, tRNA, Rfam, lncRNA: paludamentum_with_ncRNA.gff3
#   rfam_dir: null               # Rfam.cm and Rfam.clanin; null = downloaded once (Rfam 15.1)
#   trnascan_high_confidence: false
#   lncrna: true                 # FEELnc, modes with transcripts
# fantasia:
#   run: false                   # GO terms, GPU: paludamentum_go.gff3
#   hf_cache_dir: /abs/path/hf_cache     # with Rostlab/prot_t5_xl_uniref50
#   lookup_dir: /abs/path/fantasia_lookup
#   min_score: 0.5
