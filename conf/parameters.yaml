# ============================================================
# Paludamentum parameters template (parameters.yaml)
# ============================================================
# Copy this file and edit the paths for your project. Only `genome` is
# required; every other field is optional. Lines that start with '#' are
# examples. Pass the file to the launcher:
#     paludamentum --params_yaml parameters.yaml --nf_config slurm_generic
# The launcher expands '~' and environment variables and writes absolute
# paths to <outdir>/params.yaml. Use absolute paths in a params file that
# Nextflow reads directly; relative paths are resolved against the launch
# directory, not against this file.
# ============================================================

# ------------------------------------------------------------
# Required input
# ------------------------------------------------------------
genome: /path/to/genome.fa

# ------------------------------------------------------------
# RNA-Seq short reads
# ------------------------------------------------------------

# Aligned short reads (BAM), for example from VARUS. They skip HISAT2.
# rnaseq_bam:
#   - /path/to/sample1.bam

# pyVARUS output directories instead of the BAM (see docs/parameters.md):
# rnaseq_varus:
#   - /path/to/varus_short

# StringTie assembly (GTF) made outside the pipeline, from short reads, Iso-Seq
# or both: exactly one file, with the cov and TPM attributes. The reads it was
# made from may come with it (coverage track and intron hints only, nothing is
# assembled); pyVARUS directories may not. Without reads, the intron hints and
# the coverage track are derived from the assembly (bin/assembly_hints.py).
# stringtie: /path/to/stringtie.gtf
#
# One assembly per read type instead: of the short reads, and of the Iso-Seq
# reads (stringtie -L). Each stands for the reads of its type and combines with
# reads, BAM files or SRA accessions of either type (docs/parameters.md,
# "StringTie assemblies").
# rnaseq_stringtie: /path/to/short_reads.gtf
# isoseq_stringtie: /path/to/isoseq_L.gtf
#
# Transcripts of full-length reads (GTF/GFF3, e.g. the stringtie -L assembly of
# long reads) as chain evidence for the combiner; in mixed mode made automatically.
# chains:
#   - /path/to/isoseq_stringtie_L.gtf
#
# Library strandedness recovered in every short-read BAM before StringTie
# (drusilla strand-fix-bam); off: the BAMs are assembled as they are.
# strand_fix: true
# strand_fix_run_regex: null    # run id regex for a user BAM that pools runs; null = Drusilla's default (SRR...)

# Single-end reads (list of FASTQ files, or one glob string)
# rnaseq_single:
#   - /path/to/sample1.fastq.gz
#   - /path/to/sample2.fastq.gz

# Paired-end reads. Use ONE of the three accepted forms:
#
# (a) One glob string that matches all libraries (fromFilePairs).
#     A LIST of globs is NOT supported; use one glob that covers all files.
# rnaseq_paired: "/path/to/rnaseq/*_{1,2}.fastq.gz"
#
# (b) Explicit list of [r1, r2] pairs (one entry per library):
# rnaseq_paired:
#   - ["/abs/path/sample1_R1.fastq.gz", "/abs/path/sample1_R2.fastq.gz"]
#   - ["/abs/path/sample2_R1.fastq.gz", "/abs/path/sample2_R2.fastq.gz"]
#
# (c) Flat list of exactly two FASTQ files (a single library):
# rnaseq_paired:
#   - /abs/path/sample_R1.fastq.gz
#   - /abs/path/sample_R2.fastq.gz

# ------------------------------------------------------------
# Iso-Seq long reads (FASTQ): one glob string or a list
# ------------------------------------------------------------
# isoseq: "/path/to/isoseq/*.fastq.gz"
# isoseq:
#   - /path/to/isoseq1.fastq.gz

# Aligned Iso-Seq reads (BAM). They skip minimap2.
# isoseq_bam:
#   - /path/to/isoseq1.bam

# pyVARUS output directories of --longreads runs:
# isoseq_varus:
#   - /path/to/varus_long
# Mixed mode with the Drusilla flow: the output directory of
# varus assemble genome.fa --short varus_short/VARUS.bam --long varus_long/VARUS.bam --outdir varus_mixed
# mixed_varus: /path/to/varus_mixed

# ------------------------------------------------------------
# SRA downloads (run accessions)
# ------------------------------------------------------------
# rnaseq_sra_paired: [SRRXXXXXXX, SRRYYYYYYY]
# rnaseq_sra_single: [SRRZZZZZZZ]
# isoseq_sra: [DRRXXXXXXX]
# keep_downloads: false         # true copies the downloaded reads to <outdir>/sra_downloads/

# ------------------------------------------------------------
# Protein evidence (FASTA)
# ------------------------------------------------------------
# One file, or a list that is concatenated:
# proteins: /path/to/proteins.faa
# proteins:
#   - /path/to/proteins1.faa
#   - /path/to/proteins2.faa

# OrthoDB v12 partitions, downloaded and appended to the proteins:
# Metazoa, Vertebrata, Viridiplantae, Arthropoda, Fungi, Alveolata,
# Stramenopiles, Amoebozoa, Euglenozoa, Eukaryota
# odb12Partitions: [Vertebrata]

# More than 1,000,000 proteins whose ids name their species (OrthoDB, or
# Genus_species_<id> of reference proteomes): keep the proteins of the 13 species
# closest to the genome before miniprot; 0 keeps the whole database.
# protein_top_species: 13

# ------------------------------------------------------------
# General settings (defaults shown; see docs/parameters.md)
# ------------------------------------------------------------
# outdir: results                # the launcher sets <genefinder>_results
# threads: 48                    # CPUs reserved per task
# mode: null                     # inferred: abinitio, proteins, rnaseq, isoseq, mixed
# min_alignment_rate: 80         # libraries below this mapping rate are dropped
# hc_table: conf/hc_genes.yaml   # clade of the gene finder model (insect flag, classifier clade, standard_thresholds)
# auto_model: true               # one model given in a run with evidence: the launcher adds the matching
#                                # model of the other gene finder (README, "Matching models")

# ------------------------------------------------------------
# Gene finders.
# Evidence modes (rnaseq / isoseq / mixed) and mode proteins run BOTH Tiberius
# and Vipsania. Give both models; with one, the launcher adds the matching
# model of the other gene finder (auto_model). Without a Tiberius model
# (no tiberius.model_cfg and no tiberius.result: a species outside the Tiberius
# clades, e.g. Nematoda) an evidence mode runs Vipsania alone with the
# classifier trained for that; mode proteins then stops. In abinitio mode both
# gene finders run and are combined when both have a model (or result); with
# one model that gene finder runs alone (params.genefinder or <tool>.run).
# ------------------------------------------------------------
tiberius:
  # Name of a model configuration in tiberius/model_cfg of the submodule
  # (https://github.com/Gaius-Augustus/Tiberius/tree/main/model_cfg), or the
  # path of a configuration file.
  model_cfg: eudicotyledons
  # min_split_size: 20000000     # minimal genome chunk in bp
  # max_files: 20                # maximal number of chunks (parallel GPU tasks)
  # max_parallel: null           # cap of concurrent GPU tasks, e.g. 1 on a workstation
  # model_dir: null              # extracted weights instead of the download at the start of the run
  # result: /abs/path/tiberius.gff3   # existing Tiberius prediction (GFF3/GTF): Tiberius does not run
  # run: true                    # only used in abinitio mode (evidence modes and mode proteins always run it)

vipsania:
  model: Vertebrata              # clade name or model id (see docs/vipsania.md)
  finetune: true                 # finetune on the genome first (one task, no chunks)
  # model_dir: null              # directory with downloaded models (offline nodes)
  # finetune_epochs: null
  # finetune_B: null
  # finetune_lr: null
  # result: /abs/path/vipsania.gff    # existing Vipsania prediction (GFF3/GTF): Vipsania does not run
  # run: true                    # only used in abinitio mode (evidence modes and mode proteins always run it)

# ------------------------------------------------------------
# Drusilla ORFs on the StringTie assembly (evidence modes)
# ------------------------------------------------------------
# drusilla:
#   model: drusilla_model        # default: the one Drusilla model of all clades
#   shards: 1                    # parallel Drusilla processes on CPU nodes, e.g. 24 with 48 CPUs
#   cache_dir: null              # Drusilla model cache, for a model that is not bundled (the default is)
#   result: /abs/path/orfs.filtered.gtf  # existing Drusilla ORFs: Drusilla does not run
#   drop_unstranded: false       # default; true drops transcripts with strand '.' before Drusilla
#   unstranded_both_strands: true    # default; scan both strands of '.' transcripts (needs drop_unstranded: false)
#   flank_bp: 500                # default; genomic context on both sides, ORFs completed into it; 0 = off
#   orfs_per_tx: null            # null = one ORF per transcript; 0 = all (fused transcripts)

# ------------------------------------------------------------
# combine_genesets.py (the HC integration step; evidence modes and mode proteins)
# ------------------------------------------------------------
# combine:
#   classifier: conf/combiner_classifier_v1.json            # selection model of the evidence modes; false = tier rules
#   classifier_proteins: conf/combiner_classifier_protonly_v1.json   # selection model of mode proteins; false = tier rules
#   classifier_vipsania: conf/combiner_classifier_vipsania_v1.json   # evidence modes without a Tiberius model (Vipsania alone)
#   classifier_abinitio: conf/combiner_classifier_abinitio_v1.json   # mode abinitio with both gene finders (no evidence)
#   t_locus: null                # locus threshold on P, overrides the model's (0.25; mode proteins 0.20)
#   t_iso: null                  # isoform threshold on P, overrides the model's (0.30)
#   min_locus: 4                 # tier rules: keep a locus if its best model reaches this tier (default 4)

# ------------------------------------------------------------
