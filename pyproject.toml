[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paludamentum"
# The version lives in paludamentum/__init__.py (single source); keep
# nextflow.config manifest.version and the README status line in step
# (tests/test_launcher.py checks it).
dynamic = ["version"]
authors = [{ name = "Lars Gabriel" }, { name = "Katharina J. Hoff" }]
description = "Launcher of the Paludamentum evidence integration pipeline (Nextflow) for the Gaius-Augustus gene finders."
readme = "README.md"
requires-python = ">=3.9"
license = "Artistic-1.0 AND MIT"
license-files = ["LICEN[CS]E*"]
dependencies = ["pyyaml"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
paludamentum = "paludamentum.cli:main"

[project.urls]
Homepage = "https://github.com/Gaius-Augustus/Paludamentum"
Issues = "https://github.com/Gaius-Augustus/Paludamentum/issues"

[tool.hatch.version]
path = "paludamentum/__init__.py"

# The pipeline itself (main.nf, modules, bin, conf) and the submodules
# (tiberius, vipsania, drusilla) are used from a checkout. Only the launcher
# is a package; install it with `pip install -e .` from the checkout, or set
# PALUDAMENTUM_ROOT to the checkout.
[tool.hatch.build.targets.wheel]
packages = ["paludamentum"]

[tool.hatch.build.targets.sdist]
exclude = ["tiberius", "vipsania", "drusilla", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["nextflow: needs a nextflow executable (stub runs)"]
