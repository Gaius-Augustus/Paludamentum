name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .[test]
      - run: python -m pytest tests/test_launcher.py

  stub-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: nf-core/setup-nextflow@v2
      - run: python -m pip install .[test]
      - run: nextflow lint main.nf modules subworkflows
      - run: python -m pytest tests/test_stub_run.py
