<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 606" width="1400" height="606" role="img" aria-labelledby="t d">
<title id="t">Paludamentum overview</title>
<desc id="d">Inputs (genome, proteins, short reads, Iso-Seq reads), the five processing steps (ab initio prediction, protein evidence, transcript evidence, gene set integration with combine_genesets, post-processing and QC) and the output files of Paludamentum.</desc>
<defs>
<style>
.h{font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;fill:#1f2933}
.b{font-family:Helvetica,Arial,sans-serif;font-size:12.5px;fill:#52606d}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:11.5px;fill:#1f2933}
.mg{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:11.5px;fill:#52606d}
.s{font-family:Helvetica,Arial,sans-serif;font-size:10.5px;font-weight:bold;letter-spacing:1px}
.col{font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold;fill:#52606d;letter-spacing:1.5px}
.tag{font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold}
.n{font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold;fill:#ffffff}
</style>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#4f9440"/></marker>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#4577ba"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#c0504d"/></marker>
<marker id="a-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#b8921a"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#cf7f1f"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#8a63a8"/></marker>
<marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#5b6675"/></marker>
</defs>

<rect x="1" y="1" width="1398" height="604" rx="14" fill="#ffffff" stroke="#d9dee4"/>

<!-- Column headers -->
<text x="30" y="52" class="col">INPUTS</text>
<path d="M30,62 h220" stroke="#d9dee4" stroke-width="1.5"/>
<text x="290" y="52" class="col">PROCESSING</text>
<path d="M290,62 h860" stroke="#d9dee4" stroke-width="1.5"/>
<text x="1170" y="52" class="col">OUTPUTS</text>
<path d="M1170,62 h200" stroke="#d9dee4" stroke-width="1.5"/>

<!-- Inputs -->
<path d="M30,86 q0,-6 6,-6 h208 q6,0 6,6 V161 q-55.0,-15 -110.0,0 t-110.0,0 Z" fill="#e3f1e0" stroke="#4f9440" stroke-width="1.6" stroke-linejoin="round"/>
<text x="140" y="111" class="h" text-anchor="middle">Genome</text>
<text x="140" y="132" class="b" text-anchor="middle">FASTA</text>
<text x="140" y="149" class="tag" fill="#4f9440" text-anchor="middle">required</text>

<path d="M30,204 q0,-6 6,-6 h208 q6,0 6,6 V279 q-55.0,-15 -110.0,0 t-110.0,0 Z" fill="#dfeaf8" stroke="#4577ba" stroke-width="1.6" stroke-linejoin="round"/>
<text x="140" y="229" class="h" text-anchor="middle">Proteins</text>
<text x="140" y="250" class="b" text-anchor="middle">FASTA · OrthoDB v12</text>
<text x="140" y="267" class="tag" fill="#4577ba" text-anchor="middle">required with reads</text>

<path d="M30,322 q0,-6 6,-6 h208 q6,0 6,6 V397 q-55.0,-15 -110.0,0 t-110.0,0 Z" fill="#f9dedc" stroke="#c0504d" stroke-width="1.6" stroke-linejoin="round"/>
<text x="140" y="347" class="h" text-anchor="middle">Short reads</text>
<text x="140" y="368" class="b" text-anchor="middle">FASTQ · BAM · SRA · pyVARUS</text>
<text x="140" y="385" class="tag" fill="#c0504d" text-anchor="middle">optional</text>

<path d="M30,440 q0,-6 6,-6 h208 q6,0 6,6 V515 q-55.0,-15 -110.0,0 t-110.0,0 Z" fill="#fdf1cc" stroke="#b8921a" stroke-width="1.6" stroke-linejoin="round"/>
<text x="140" y="465" class="h" text-anchor="middle">Iso-Seq reads</text>
<text x="140" y="486" class="b" text-anchor="middle">FASTQ · SRA · pyVARUS</text>
<text x="140" y="503" class="tag" fill="#b8921a" text-anchor="middle">optional</text>

<!-- Step 1 -->
<rect x="290" y="80" width="260" height="88" rx="10" fill="#e3f1e0" stroke="#4f9440" stroke-width="1.6"/>
<circle cx="314" cy="105" r="11" fill="#4f9440"/>
<text x="314" y="109.5" class="n" text-anchor="middle">1</text>
<text x="333" y="110" class="h"><tspan font-style="italic">Ab initio</tspan> prediction</text>
<text x="304" y="136" class="b">Tiberius + Vipsania (--finetune)</text>
<text x="304" y="154" class="b">in parallel on GPUs</text>

<!-- Step 2 -->
<rect x="290" y="198" width="260" height="88" rx="10" fill="#dfeaf8" stroke="#4577ba" stroke-width="1.6"/>
<circle cx="314" cy="223" r="11" fill="#4577ba"/>
<text x="314" y="227.5" class="n" text-anchor="middle">2</text>
<text x="333" y="228" class="h">Protein evidence</text>
<text x="304" y="254" class="b">miniprot → boundary scorer</text>
<text x="304" y="272" class="b">→ miniprothint</text>

<!-- Step 3 -->
<rect x="290" y="316" width="260" height="206" rx="10" fill="#fde6cf" stroke="#cf7f1f" stroke-width="1.6"/>
<circle cx="314" cy="341" r="11" fill="#cf7f1f"/>
<text x="314" y="345.5" class="n" text-anchor="middle">3</text>
<text x="333" y="346" class="h">Transcript evidence</text>
<text x="304" y="378" class="s" fill="#cf7f1f">ALIGNMENT</text>
<text x="304" y="397" class="b">HISAT2: short reads</text>
<text x="304" y="415" class="b">minimap2: Iso-Seq reads</text>
<text x="304" y="433" class="b">Poorly aligning libraries dropped</text>
<text x="304" y="465" class="s" fill="#cf7f1f">ASSEMBLY</text>
<text x="304" y="484" class="b">StringTie: one assembly, all reads</text>

<!-- Step 4 -->
<rect x="580" y="80" width="270" height="442" rx="10" fill="#ebe1f2" stroke="#8a63a8" stroke-width="1.6"/>
<circle cx="604" cy="105" r="11" fill="#8a63a8"/>
<text x="604" y="109.5" class="n" text-anchor="middle">4</text>
<text x="623" y="110" class="h">Gene set integration</text>
<text x="594" y="144" class="s" fill="#8a63a8">ORF PREDICTION</text>
<text x="594" y="163" class="b">TD2 and Drusilla on the</text>
<text x="594" y="181" class="b">StringTie assembly</text>
<text x="594" y="215" class="s" fill="#8a63a8">EVIDENCE</text>
<text x="594" y="234" class="b">DIAMOND: all four protein sets</text>
<text x="594" y="252" class="b">bedtools genomecov: read depth</text>
<text x="594" y="270" class="b">bam2hints: intron hints</text>
<text x="594" y="304" class="s" fill="#8a63a8">INTEGRATION</text>
<text x="594" y="323" class="m">combine_genesets.py</text>
<text x="594" y="341" class="b">four gene sets + RNA/protein evidence</text>
<text x="594" y="359" class="b">→ high-confidence genes</text>
<text x="594" y="393" class="s" fill="#8a63a8">INSECT CLADES</text>
<text x="594" y="412" class="b">Drop single-exon genes from</text>
<text x="594" y="430" class="b">Tiberius predictions</text>

<!-- Step 5 -->
<rect x="870" y="80" width="280" height="442" rx="10" fill="#eceff3" stroke="#5b6675" stroke-width="1.6"/>
<circle cx="894" cy="105" r="11" fill="#5b6675"/>
<text x="894" y="109.5" class="n" text-anchor="middle">5</text>
<text x="913" y="110" class="h">Post-processing &amp; QC</text>
<text x="884" y="144" class="s" fill="#5b6675">FILTER</text>
<text x="884" y="163" class="b">Drop broken CDS, internal stops</text>
<text x="884" y="197" class="s" fill="#5b6675">UTRS</text>
<text x="884" y="216" class="b">From the StringTie assembly</text>
<text x="884" y="250" class="s" fill="#5b6675">EXPORT</text>
<text x="884" y="269" class="b">GFF3 (validated), GTF,</text>
<text x="884" y="287" class="b">protein and CDS FASTA</text>
<text x="884" y="321" class="s" fill="#5b6675">OPTIONAL QC</text>
<text x="884" y="340" class="b">BUSCO, compleasm, OMArk,</text>
<text x="884" y="358" class="b">gffcompare, ncRNA,</text>
<text x="884" y="376" class="b">GO terms (FANTASIA-Lite)</text>
<text x="884" y="410" class="s" fill="#5b6675">SUMMARY</text>
<text x="884" y="429" class="m">report.html</text>

<!-- Outputs -->
<path d="M1170,86 q0,-6 6,-6 h188 q6,0 6,6 V161 q-50.0,-15 -100.0,0 t-100.0,0 Z" fill="#eceff3" stroke="#5b6675" stroke-width="1.6" stroke-linejoin="round"/>
<text x="1270" y="111" class="h" text-anchor="middle">Final annotation</text>
<text x="1270" y="132" class="mg" text-anchor="middle">combined_evidence.gff3</text>
<text x="1270" y="149" class="mg" text-anchor="middle">combined_evidence.gtf</text>

<path d="M1170,204 q0,-6 6,-6 h188 q6,0 6,6 V279 q-50.0,-15 -100.0,0 t-100.0,0 Z" fill="#eceff3" stroke="#5b6675" stroke-width="1.6" stroke-linejoin="round"/>
<text x="1270" y="229" class="h" text-anchor="middle">Sequences</text>
<text x="1270" y="250" class="mg" text-anchor="middle">combined_evidence_*.fa</text>
<text x="1270" y="267" class="b" text-anchor="middle">protein, CDS</text>

<rect x="1170" y="316" width="200" height="206" rx="10" fill="#fafbfc" stroke="#b6bec8" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="1184" y="344" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933">Also written</text>
<text x="1184" y="376" class="m">intermediate/</text>
<text x="1184" y="394" class="b">gene sets, combine report</text>
<text x="1184" y="426" class="m">qc/, report.html</text>
<text x="1184" y="444" class="b">quality control</text>
<text x="1184" y="476" class="m">hintsfile.gff</text>
<text x="1184" y="494" class="b">all hints</text>

<!-- Arrows -->
<path d="M250,124 L290,124" fill="none" stroke="#4f9440" stroke-width="2" marker-end="url(#a-green)"/>
<path d="M250,242 L290,242" fill="none" stroke="#4577ba" stroke-width="2" marker-end="url(#a-blue)"/>
<path d="M250,360 L290,360" fill="none" stroke="#c0504d" stroke-width="2" marker-end="url(#a-red)"/>
<path d="M250,478 L290,478" fill="none" stroke="#b8921a" stroke-width="2" marker-end="url(#a-yellow)"/>
<path d="M550,124 L580,124" fill="none" stroke="#4f9440" stroke-width="2" marker-end="url(#a-green)"/>
<path d="M550,242 L580,242" fill="none" stroke="#4577ba" stroke-width="2" marker-end="url(#a-blue)"/>
<path d="M550,419 L580,419" fill="none" stroke="#cf7f1f" stroke-width="2" marker-end="url(#a-orange)"/>
<path d="M850,301 L870,301" fill="none" stroke="#8a63a8" stroke-width="2" marker-end="url(#a-purple)"/>
<path d="M1150,124 L1170,124" fill="none" stroke="#5b6675" stroke-width="2" marker-end="url(#a-grey)"/>
<path d="M1150,242 L1170,242" fill="none" stroke="#5b6675" stroke-width="2" marker-end="url(#a-grey)"/>
<path d="M1150,419 L1170,419" fill="none" stroke="#5b6675" stroke-width="2" marker-end="url(#a-grey)"/>

<!-- Footnote -->
<text x="30" y="562" class="b">Modes <tspan class="m">abinitio</tspan> and <tspan class="m">proteins</tspan> run only step 1 (one gene finder) and step 5; output stem <tspan class="m">&lt;tool&gt;_ab_initio</tspan> / <tspan class="m">&lt;tool&gt;_evidence</tspan>.</text>
</svg>
