<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1310 580" width="1310" height="580" role="img" aria-labelledby="t d">
<title id="t">Insect run of Paludamentum</title>
<desc id="d">The unified HC-gene step applied to an insect gene-finder model: Tiberius and Vipsania both run (Vipsania with --finetune on the insect model), both ORF callers run on the StringTie assembly, and combine_genesets receives --drop-lone-single-exon tiberius for insect clades.</desc>
<defs><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#4f9440"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#4577ba"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#c0504d"/></marker><marker id="a-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#b8921a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#cf7f1f"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#8a63a8"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#5b6675"/></marker></defs>
<rect x="1" y="1" width="1308" height="578" rx="14" fill="#ffffff" stroke="#d9dee4"/>
<text x="30" y="52" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="start" letter-spacing="1.5">INPUTS</text>
<path d="M30,62 h200" stroke="#d9dee4" stroke-width="1.5"/>
<text x="258" y="52" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="start" letter-spacing="1.5">PROCESSING</text>
<path d="M258,62 h904" stroke="#d9dee4" stroke-width="1.5"/>
<text x="1182" y="52" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="start" letter-spacing="1.5">OUTPUT</text>
<path d="M1182,62 h128" stroke="#d9dee4" stroke-width="1.5"/>
<path d="M30,86 q0,-6 6,-6 h188 q6,0 6,6 V181 q-50.0,-15 -100.0,0 t-100.0,0 Z" fill="#f9dedc" stroke="#c0504d" stroke-width="1.6" stroke-linejoin="round"/>
<text x="130.0" y="111" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">RNA-Seq or Iso-Seq</text>
<text x="130.0" y="132" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="middle">FASTQ, BAM, SRA, pyVARUS</text>
<text x="130.0" y="149" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#c0504d" text-anchor="middle">required</text>
<path d="M30,226 q0,-6 6,-6 h188 q6,0 6,6 V321 q-50.0,-15 -100.0,0 t-100.0,0 Z" fill="#e3f1e0" stroke="#4f9440" stroke-width="1.6" stroke-linejoin="round"/>
<text x="130.0" y="251" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Genome</text>
<text x="130.0" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="middle">FASTA</text>
<text x="130.0" y="289" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#4f9440" text-anchor="middle">required</text>
<path d="M30,368 q0,-6 6,-6 h188 q6,0 6,6 V463 q-50.0,-15 -100.0,0 t-100.0,0 Z" fill="#dfeaf8" stroke="#4577ba" stroke-width="1.6" stroke-linejoin="round"/>
<text x="130.0" y="393" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Proteins</text>
<text x="130.0" y="414" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="middle">FASTA / OrthoDB v12</text>
<text x="130.0" y="431" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#4577ba" text-anchor="middle">required</text>
<rect x="258" y="80" width="164" height="108" rx="10" fill="#fde6cf" stroke="#cf7f1f" stroke-width="1.6"/>
<circle cx="282" cy="105" r="11" fill="#cf7f1f"/>
<text x="282" y="109.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="301" y="110" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Alignment</text>
<text x="272" y="133" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">HISAT2, minimap2;</text>
<text x="272" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">BAM as given</text>
<rect x="440" y="80" width="164" height="108" rx="10" fill="#fde6cf" stroke="#cf7f1f" stroke-width="1.6"/>
<circle cx="464" cy="105" r="11" fill="#cf7f1f"/>
<text x="464" y="109.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="483" y="110" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">StringTie</text>
<text x="454" y="133" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">one assembly</text>
<text x="454" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">of all reads</text>
<rect x="622" y="80" width="164" height="108" rx="10" fill="#ebe1f2" stroke="#8a63a8" stroke-width="1.6"/>
<circle cx="646" cy="105" r="11" fill="#8a63a8"/>
<text x="646" y="109.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="665" y="110" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">TD2 + revise</text>
<text x="636" y="133" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">LongOrfs, Predict,</text>
<text x="636" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">shorten + classify</text>
<text x="636" y="167" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">with two DIAMOND</text>
<rect x="804" y="80" width="164" height="108" rx="10" fill="#ebe1f2" stroke="#8a63a8" stroke-width="1.6"/>
<circle cx="828" cy="105" r="11" fill="#8a63a8"/>
<text x="828" y="109.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="847" y="110" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Drusilla</text>
<text x="818" y="133" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">model insects:</text>
<text x="818" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">ORFs on the</text>
<text x="818" y="167" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">kept StringTie</text>
<rect x="258" y="220" width="710" height="108" rx="10" fill="#e3f1e0" stroke="#4f9440" stroke-width="1.6"/>
<circle cx="282" cy="245" r="11" fill="#4f9440"/>
<text x="282" y="249.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="301" y="250" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Both gene finders in parallel</text>
<text x="272" y="273" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">Tiberius (insect model)   +   Vipsania Insecta, --finetune on the genome</text>
<text x="272" y="290" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">(Vipsania fine-tune is one GPU task on the whole genome)</text>
<rect x="258" y="362" width="710" height="108" rx="10" fill="#dfeaf8" stroke="#4577ba" stroke-width="1.6"/>
<circle cx="282" cy="387" r="11" fill="#4577ba"/>
<text x="282" y="391.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="301" y="392" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Protein evidence (required)</text>
<text x="272" y="415" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">miniprot + miniprot-boundary-scorer + miniprothint;</text>
<text x="272" y="432" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">DIAMOND (14-col) on all four protein sets</text>
<rect x="1000" y="80" width="162" height="390" rx="10" fill="#eceff3" stroke="#5b6675" stroke-width="1.6"/>
<circle cx="1024" cy="105" r="11" fill="#5b6675"/>
<text x="1024" y="109.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="1043" y="110" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">combine_genesets.py</text>
<text x="1014" y="133" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">Tiberius + Vipsania +</text>
<text x="1014" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">revised TD2 + Drusilla,</text>
<text x="1014" y="167" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">all 4 DIAMOND tables,</text>
<text x="1014" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">miniprot / hc.gff hints,</text>
<text x="1014" y="201" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">introns + rna_cov.bg.gz;</text>
<text x="1014" y="218" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start"></text>
<text x="1014" y="235" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">Insecta clade adds</text>
<text x="1014" y="252" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">--drop-lone-single-exon</text>
<text x="1014" y="269" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">tiberius</text>
<path d="M1000,496 q0,-6 6,-6 h150 q6,0 6,6 V591 q-40.5,-15 -81.0,0 t-81.0,0 Z" fill="#eceff3" stroke="#5b6675" stroke-width="1.6" stroke-linejoin="round"/>
<text x="1081.0" y="521" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Final annotation</text>
<text x="1081.0" y="542" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="middle">combined_evidence.gff3</text>
<path d="M230,134.0 L258,134.0" fill="none" stroke="#c0504d" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-red)"/>
<path d="M422,134.0 L440,134.0" fill="none" stroke="#cf7f1f" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-orange)"/>
