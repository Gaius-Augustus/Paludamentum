<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1310 574" width="1310" height="574" role="img" aria-labelledby="t d">
<title id="t">Insect flow of Paludamentum</title>
<desc id="d">The recommended flow for insects, without protein evidence, numbered with the steps of the overview: Vipsania, fine-tuned on the genome, predicts the ab initio genes (1); reads are aligned and assembled with StringTie into one transcript set (3), which is filtered, and Drusilla predicts the ORFs of the kept transcripts with its insect model, the high-confidence genes (4); all ab initio genes are merged with the ORFs (5) and post-processed into vipsania_evidence.gff3 (6). Step 2, protein evidence, does not run, and with it no codon fix, LightGBM filter or hint rescue. Runs that differ get a warning.</desc>
<defs><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#4f9440"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#4577ba"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#c0504d"/></marker><marker id="a-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#b8921a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#cf7f1f"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#8a63a8"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#5b6675"/></marker></defs>
<rect x="1" y="1" width="1308" height="572" rx="14" fill="#ffffff" stroke="#d9dee4"/>
<text x="30" y="52" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="start" letter-spacing="1.5">INPUTS</text>
<path d="M30,62 h200" stroke="#d9dee4" stroke-width="1.5"/>
<text x="258" y="52" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="start" letter-spacing="1.5">PROCESSING</text>
<path d="M258,62 h822" stroke="#d9dee4" stroke-width="1.5"/>
<text x="1104" y="52" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606d" text-anchor="start" letter-spacing="1.5">OUTPUT</text>
<path d="M1104,62 h180" stroke="#d9dee4" stroke-width="1.5"/>
<path d="M30,86 q0,-6 6,-6 h188 q6,0 6,6 V177 q-50.0,-15 -100.0,0 t-100.0,0 Z" fill="#f9dedc" stroke="#c0504d" stroke-width="1.6" stroke-linejoin="round"/>
<text x="130.0" y="111" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">RNA-Seq or Iso-Seq</text>
<text x="130.0" y="132" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="middle">FASTQ, BAM, SRA, pyVARUS</text>
<text x="130.0" y="149" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#c0504d" text-anchor="middle">required</text>
<path d="M30,236 q0,-6 6,-6 h188 q6,0 6,6 V327 q-50.0,-15 -100.0,0 t-100.0,0 Z" fill="#e3f1e0" stroke="#4f9440" stroke-width="1.6" stroke-linejoin="round"/>
<text x="130.0" y="261" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Genome</text>
<text x="130.0" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="middle">FASTA</text>
<text x="130.0" y="299" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#4f9440" text-anchor="middle">required</text>
<path d="M30,386 q0,-6 6,-6 h188 q6,0 6,6 V477 q-50.0,-15 -100.0,0 t-100.0,0 Z" fill="#ffffff" stroke="#5b6675" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4"/>
<text x="130.0" y="411" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Proteins</text>
<text x="130.0" y="432" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="middle">not needed</text>
<text x="130.0" y="449" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#5b6675" text-anchor="middle">a warning if given</text>
<rect x="258" y="80" width="148" height="104" rx="10" fill="#fde6cf" stroke="#cf7f1f" stroke-width="1.6"/>
<circle cx="282" cy="105" r="11" fill="#cf7f1f"/>
<text x="282" y="109.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="301" y="110" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Alignment</text>
<text x="272" y="133" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">HISAT2, minimap2;</text>
<text x="272" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">BAM as given</text>
<rect x="424" y="80" width="148" height="104" rx="10" fill="#fde6cf" stroke="#cf7f1f" stroke-width="1.6"/>
<circle cx="448" cy="105" r="11" fill="#cf7f1f"/>
<text x="448" y="109.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="467" y="110" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">StringTie</text>
<text x="438" y="133" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">one assembly</text>
<text x="438" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">of all reads</text>
<rect x="590" y="80" width="148" height="104" rx="10" fill="#ebe1f2" stroke="#8a63a8" stroke-width="1.6"/>
<circle cx="614" cy="105" r="11" fill="#8a63a8"/>
<text x="614" y="109.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="633" y="110" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Filter</text>
<text x="604" y="133" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">length, coverage</text>
<text x="604" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">and TPM of the</text>
<text x="604" y="167" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">transcripts</text>
<rect x="756" y="80" width="148" height="104" rx="10" fill="#ebe1f2" stroke="#8a63a8" stroke-width="1.6"/>
<circle cx="780" cy="105" r="11" fill="#8a63a8"/>
<text x="780" y="109.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="799" y="110" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Drusilla</text>
<text x="770" y="133" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">model insects: ORFs</text>
<text x="770" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">= HC genes; nested</text>
<text x="770" y="167" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">isoforms collapsed</text>
<rect x="258" y="230" width="646" height="104" rx="10" fill="#e3f1e0" stroke="#4f9440" stroke-width="1.6"/>
<circle cx="282" cy="255" r="11" fill="#4f9440"/>
<text x="282" y="259.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="301" y="260" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Vipsania</text>
<text x="272" y="283" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">model Insecta, fine-tuned on the genome before it annotates it:</text>
<text x="272" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">one GPU task on the whole genome (about 4 h on an A100)</text>
<rect x="930" y="80" width="150" height="254" rx="10" fill="#eceff3" stroke="#5b6675" stroke-width="1.6"/>
<circle cx="954" cy="105" r="11" fill="#5b6675"/>
<text x="954" y="109.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="973" y="110" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Merge</text>
<text x="944" y="133" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">Drusilla ORFs</text>
<text x="944" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">and all</text>
<text x="944" y="167" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start"><tspan font-style="italic">ab initio</tspan> genes,</text>
<text x="944" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">no filter;</text>
<text x="944" y="201" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">identical CDS</text>
<text x="944" y="218" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">collapsed</text>
<rect x="1104" y="80" width="180" height="104" rx="10" fill="#eceff3" stroke="#5b6675" stroke-width="1.6"/>
<circle cx="1128" cy="105" r="11" fill="#5b6675"/>
<text x="1128" y="109.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<text x="1147" y="110" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Post-processing</text>
<text x="1118" y="133" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">sanity filter, UTRs</text>
<text x="1118" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">from StringTie,</text>
<text x="1118" y="167" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">GFF3, GTF, FASTA</text>
<path d="M1104,236 q0,-6 6,-6 h168 q6,0 6,6 V327 q-45.0,-15 -90.0,0 t-90.0,0 Z" fill="#eceff3" stroke="#5b6675" stroke-width="1.6" stroke-linejoin="round"/>
<text x="1194.0" y="261" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Final annotation</text>
<text x="1194.0" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="middle">vipsania_evidence.gff3</text>
<path d="M230,132.0 L258,132.0" fill="none" stroke="#c0504d" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-red)"/>
<path d="M406,132.0 L424,132.0" fill="none" stroke="#cf7f1f" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-orange)"/>
<path d="M572,132.0 L590,132.0" fill="none" stroke="#cf7f1f" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-orange)"/>
<path d="M738,132.0 L756,132.0" fill="none" stroke="#8a63a8" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-purple)"/>
<path d="M904,132.0 L930,132.0" fill="none" stroke="#8a63a8" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-purple)"/>
<path d="M230,282.0 L258,282.0" fill="none" stroke="#4f9440" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-green)"/>
<path d="M904,282.0 L930,282.0" fill="none" stroke="#4f9440" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-green)"/>
<path d="M1080,132.0 L1104,132.0" fill="none" stroke="#5b6675" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-grey)"/>
<path d="M1194.0,184 L1194.0,230" fill="none" stroke="#5b6675" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-grey)"/>
<rect x="258" y="380" width="314" height="116" rx="10" fill="#ffffff" stroke="#5b6675" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="272" y="410" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Not in this flow</text>
<text x="272" y="433" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">step 2: no protein alignments,</text>
<text x="272" y="450" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">no stop and start codon fix,</text>
<text x="272" y="467" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">no LightGBM filter, no hint rescue</text>
<text x="272" y="484" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">(they lowered the accuracy on insects)</text>
<rect x="590" y="380" width="490" height="116" rx="10" fill="#fdf1cc" stroke="#b8921a" stroke-width="1.6"/>
<text x="604" y="410" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Other choices get a warning</text>
<text x="604" y="433" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">Tiberius instead of Vipsania, Vipsania without fine-tuning,</text>
<text x="604" y="450" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">no RNA-Seq or Iso-Seq, or protein evidence: the Nextflow log</text>
<text x="604" y="467" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">names each difference (recommended of Insecta in</text>
<text x="604" y="484" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">conf/hc_genes.yaml); the run goes on.</text>
<rect x="1104" y="380" width="180" height="116" rx="10" fill="#e3f1e0" stroke="#4f9440" stroke-width="1.6"/>
<text x="1118" y="410" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Gene F1</text>
<text x="1118" y="433" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">this flow       75.2</text>
<text x="1118" y="450" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">BRAKER3         75.4</text>
<text x="1118" y="467" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">Tiberius        57.6</text>
<text x="1118" y="484" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">mean of 11 insects</text>
<text x="30" y="530" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">Numbers: the steps of the overview figure. Gene F1: mean over 11 RefSeq insects (Lars Gabriel), gffcompare 0.12.10 --strict-match -e 3 -T on the CDS;</text>
<text x="30" y="551" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">BRAKER3 with protein evidence.</text>
</svg>
