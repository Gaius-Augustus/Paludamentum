<path d="M968,134.0 L1000,134.0" fill="none" stroke="#8a63a8" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-purple)"/>
<path d="M230,274.0 L258,274.0" fill="none" stroke="#4f9440" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-green)"/>
<path d="M968,274.0 L1000,274.0" fill="none" stroke="#4f9440" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-green)"/>
<path d="M230,416.0 L258,416.0" fill="none" stroke="#4577ba" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<path d="M968,416.0 L1000,416.0" fill="none" stroke="#4577ba" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<path d="M1081.0,470 L1081.0,490" fill="none" stroke="#5b6675" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-grey)"/>
<text x="30" y="628" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">The unified HC flow is the same for every clade; insect clades add --drop-lone-single-exon tiberius to combine_genesets.</text>
<text x="30" y="648" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">A run that differs from the clade's recommended flow in conf/hc_genes.yaml gets a warning (gene finder, fine-tune, transcripts, proteins).</text>
</svg>
