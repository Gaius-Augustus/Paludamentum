<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 352" width="1160" height="352" role="img" aria-labelledby="t d">
<title id="t">Drusilla flow without proteins</title>
<desc id="d">The flow recommended for insects: one StringTie assembly, a transcript filter and Drusilla ORFs give the high-confidence genes, which are merged with all ab initio genes of Vipsania, fine-tuned on the genome. Without protein evidence there is no codon fix, no LightGBM filter and no hint rescue.</desc>
<defs><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#4f9440"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#4577ba"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#c0504d"/></marker><marker id="a-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#b8921a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#cf7f1f"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#8a63a8"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#5b6675"/></marker></defs>
<rect x="1" y="1" width="1158" height="350" rx="14" fill="#ffffff" stroke="#d9dee4"/>
<path d="M20,50 q0,-6 6,-6 h148 q6,0 6,6 V125 q-40.0,-15 -80.0,0 t-80.0,0 Z" fill="#f9dedc" stroke="#c0504d" stroke-width="1.6" stroke-linejoin="round"/>
<text x="100.0" y="75" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Read alignments</text>
<text x="100.0" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="middle">short reads, Iso-Seq</text>
<rect x="202" y="44" width="160" height="88" rx="10" fill="#fde6cf" stroke="#cf7f1f" stroke-width="1.6"/>
<circle cx="226" cy="69" r="11" fill="#cf7f1f"/>
<text x="226" y="73.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="245" y="74" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">StringTie</text>
<text x="216" y="97" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">one assembly of</text>
<text x="216" y="114" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">all reads</text>
<rect x="384" y="44" width="160" height="88" rx="10" fill="#fde6cf" stroke="#cf7f1f" stroke-width="1.6"/>
<circle cx="408" cy="69" r="11" fill="#cf7f1f"/>
<text x="408" y="73.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="427" y="74" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Transcript filter</text>
<text x="398" y="97" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">length, coverage,</text>
<text x="398" y="114" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">TPM</text>
<rect x="566" y="44" width="160" height="88" rx="10" fill="#ebe1f2" stroke="#8a63a8" stroke-width="1.6"/>
<circle cx="590" cy="69" r="11" fill="#8a63a8"/>
<text x="590" y="73.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="609" y="74" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Drusilla</text>
<text x="580" y="97" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">ORFs, also truncated</text>
<text x="580" y="114" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">at transcript ends</text>
<rect x="748" y="44" width="160" height="88" rx="10" fill="#ebe1f2" stroke="#8a63a8" stroke-width="1.6"/>
<circle cx="772" cy="69" r="11" fill="#8a63a8"/>
<text x="772" y="73.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="791" y="74" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Collapse</text>
<text x="762" y="97" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">isoforms whose CDS</text>
<text x="762" y="114" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">is part of another</text>
<path d="M202,196 q0,-6 6,-6 h148 q6,0 6,6 V271 q-40.0,-15 -80.0,0 t-80.0,0 Z" fill="#e3f1e0" stroke="#4f9440" stroke-width="1.6" stroke-linejoin="round"/>
<text x="282.0" y="221" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle"><tspan font-style="italic">Ab initio</tspan> genes</text>
<text x="282.0" y="242" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="middle">Vipsania, fine-tuned</text>
<rect x="968" y="44" width="168" height="88" rx="10" fill="#eceff3" stroke="#5b6675" stroke-width="1.6"/>
<circle cx="992" cy="69" r="11" fill="#5b6675"/>
<text x="992" y="73.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="1011" y="74" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Merge</text>
<text x="982" y="97" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">ORFs and all</text>
<text x="982" y="114" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start"><tspan font-style="italic">ab initio</tspan> genes</text>
<path d="M968,196 q0,-6 6,-6 h156 q6,0 6,6 V271 q-42.0,-15 -84.0,0 t-84.0,0 Z" fill="#eceff3" stroke="#5b6675" stroke-width="1.6" stroke-linejoin="round"/>
<text x="1052.0" y="221" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Final annotation</text>
<text x="1052.0" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="middle">&lt;tool&gt;_evidence.gff3</text>
<path d="M180,88.0 L202,88.0" fill="none" stroke="#c0504d" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-red)"/>
<path d="M362,88.0 L384,88.0" fill="none" stroke="#cf7f1f" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-orange)"/>
<path d="M544,88.0 L566,88.0" fill="none" stroke="#cf7f1f" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-orange)"/>
<path d="M726,88.0 L748,88.0" fill="none" stroke="#8a63a8" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-purple)"/>
<path d="M908,74.0 L968,74.0" fill="none" stroke="#8a63a8" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-purple)"/>
<text x="938.0" y="66.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="middle">HC genes</text>
<path d="M362,234.0 L938.0,234.0 L938.0,102.0 L968,102.0" fill="none" stroke="#4f9440" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-green)"/>
<text x="650.0" y="225.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="middle">all genes: no filter, no rescue</text>
<path d="M1052.0,132 L1052.0,190" fill="none" stroke="#5b6675" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-grey)"/>
<text x="20" y="320" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="start">Without protein evidence there is no codon fix, no LightGBM filter and no hint rescue (compare the Drusilla flow with proteins).</text>
<text x="20" y="341" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">Recommended for insects in conf/hc_genes.yaml: Vipsania with the model Insecta, fine-tuned on the genome (vipsania.finetune: true).</text>
</svg>
