<text x="646.0" y="354.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="middle">partial, no transcript</text>
<text x="646.0" y="371.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="middle">kept at the locus</text>
