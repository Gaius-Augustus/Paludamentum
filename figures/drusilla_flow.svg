<path d="M464.0,424 L464.0,454 L938,454 L938,234.0 L968,234.0" fill="none" stroke="#4f9440" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-green)"/>
<circle cx="938" cy="380.0" r="3.5" fill="#4f9440"/>
<text x="701.0" y="473" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="middle">correct: kept</text>
