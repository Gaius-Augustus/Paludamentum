<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 510" width="1160" height="510" role="img" aria-labelledby="t d">
<title id="t">Drusilla flow of Paludamentum</title>
<desc id="d">For vertebrate models: one StringTie assembly, a transcript filter, Drusilla ORFs and a codon fix give the high-confidence genes; a LightGBM filter and a hint rescue treat the ab initio predictions; both are merged into the final annotation.</desc>
<defs><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#4f9440"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#4577ba"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#c0504d"/></marker><marker id="a-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#b8921a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#cf7f1f"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#8a63a8"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 Z" fill="#5b6675"/></marker></defs>
<rect x="1" y="1" width="1158" height="508" rx="14" fill="#ffffff" stroke="#d9dee4"/>
<path d="M20,50 q0,-6 6,-6 h148 q6,0 6,6 V125 q-40.0,-15 -80.0,0 t-80.0,0 Z" fill="#f9dedc" stroke="#c0504d" stroke-width="1.6" stroke-linejoin="round"/>
<text x="100.0" y="75" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Read alignments</text>
<text x="100.0" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="middle">short reads, Iso-Seq</text>
<rect x="202" y="44" width="160" height="88" rx="10" fill="#fde6cf" stroke="#cf7f1f" stroke-width="1.6"/>
<circle cx="226" cy="69" r="11" fill="#cf7f1f"/>
<text x="226" y="73.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="245" y="74" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">StringTie</text>
<text x="216" y="97" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">one assembly of</text>
<text x="216" y="114" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">all reads</text>
<rect x="384" y="44" width="160" height="88" rx="10" fill="#fde6cf" stroke="#cf7f1f" stroke-width="1.6"/>
<circle cx="408" cy="69" r="11" fill="#cf7f1f"/>
<text x="408" y="73.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="427" y="74" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Transcript filter</text>
<text x="398" y="97" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">length, coverage,</text>
<text x="398" y="114" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">TPM</text>
<rect x="566" y="44" width="160" height="88" rx="10" fill="#ebe1f2" stroke="#8a63a8" stroke-width="1.6"/>
<circle cx="590" cy="69" r="11" fill="#8a63a8"/>
<text x="590" y="73.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="609" y="74" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Drusilla</text>
<text x="580" y="97" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">ORFs, also truncated</text>
<text x="580" y="114" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">at transcript ends</text>
<rect x="748" y="44" width="160" height="88" rx="10" fill="#ebe1f2" stroke="#8a63a8" stroke-width="1.6"/>
<circle cx="772" cy="69" r="11" fill="#8a63a8"/>
<text x="772" y="73.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="791" y="74" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Codon fix</text>
<text x="762" y="97" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">stop and start codons;</text>
<text x="762" y="114" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">isoforms collapsed</text>
<rect x="566" y="190" width="160" height="88" rx="10" fill="#dfeaf8" stroke="#4577ba" stroke-width="1.6"/>
<text x="580" y="220" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Protein evidence</text>
<text x="580" y="243" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">miniprot alignments,</text>
<text x="580" y="260" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">miniprothint hints</text>
<path d="M202,342 q0,-6 6,-6 h148 q6,0 6,6 V417 q-40.0,-15 -80.0,0 t-80.0,0 Z" fill="#e3f1e0" stroke="#4f9440" stroke-width="1.6" stroke-linejoin="round"/>
<text x="282.0" y="367" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle"><tspan font-style="italic">Ab initio</tspan> genes</text>
<text x="282.0" y="388" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="middle">Tiberius or Vipsania</text>
<rect x="384" y="336" width="160" height="88" rx="10" fill="#e3f1e0" stroke="#4f9440" stroke-width="1.6"/>
<circle cx="408" cy="361" r="11" fill="#4f9440"/>
<text x="408" y="365.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="427" y="366" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">LightGBM filter</text>
<text x="398" y="389" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">wrong, partial</text>
<text x="398" y="406" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">or correct</text>
<rect x="748" y="336" width="160" height="88" rx="10" fill="#e3f1e0" stroke="#4f9440" stroke-width="1.6"/>
<circle cx="772" cy="361" r="11" fill="#4f9440"/>
<text x="772" y="365.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
<text x="791" y="366" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Hint rescue</text>
<text x="762" y="389" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">Tiberius with</text>
<text x="762" y="406" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">protein hints</text>
<rect x="968" y="190" width="168" height="88" rx="10" fill="#eceff3" stroke="#5b6675" stroke-width="1.6"/>
<circle cx="992" cy="215" r="11" fill="#5b6675"/>
<text x="992" y="219.5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>
<text x="1011" y="220" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Merge</text>
<text x="982" y="243" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">ORFs, kept and rescued</text>
<text x="982" y="260" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start"><tspan font-style="italic">ab initio</tspan> genes</text>
<path d="M968,342 q0,-6 6,-6 h156 q6,0 6,6 V417 q-42.0,-15 -84.0,0 t-84.0,0 Z" fill="#eceff3" stroke="#5b6675" stroke-width="1.6" stroke-linejoin="round"/>
<text x="1052.0" y="367" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="middle">Final annotation</text>
<text x="1052.0" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="middle">&lt;tool&gt;_evidence.gff3</text>
