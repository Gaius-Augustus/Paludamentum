<path d="M566,234.0 L464.0,234.0 L464.0,336" fill="none" stroke="#4577ba" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-blue)"/>
<path d="M362,380.0 L384,380.0" fill="none" stroke="#4f9440" stroke-width="2" stroke-linejoin="round" marker-end="url(#a-green)"/>
